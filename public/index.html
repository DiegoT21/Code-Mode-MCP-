<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Code Mode MCP</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="lateral">
      <div class="marca">
        <img src="logo.svg" alt="" width="38" height="38" />
        <div>
          <h1>Code Mode MCP</h1>
          <p class="sub" data-t="tagline"></p>
        </div>
      </div>

      <nav class="pestanas" role="tablist" aria-label="Sections">
        <button role="tab" data-pestana="setup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg><span data-t="tab.setup"></span></button>
        <button role="tab" data-pestana="inventory"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg><span data-t="tab.inventory"></span></button>
        <button role="tab" data-pestana="usage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-t="tab.usage"></span></button>
        <button role="tab" data-pestana="sandbox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg><span data-t="tab.sandbox"></span></button>
        <button role="tab" data-pestana="history"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-t="tab.history"></span></button>
        <button role="tab" data-pestana="learn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6M12 17h.01"/></svg><span data-t="tab.learn"></span></button>
      </nav>

      <div class="pie-lateral">
        <div class="idioma" role="group" aria-label="Language">
          <button type="button" data-idioma="en">EN</button>
          <button type="button" data-idioma="es">ES</button>
        </div>
        <span id="fecha-inventario" class="tenue"></span>
        <button id="refrescar" class="boton secundario chico" type="button" data-t="refresh"></button>
      </div>
    </aside>

    <main class="contenido">
      <section id="setup" class="panel" role="tabpanel"></section>

      <section id="inventory" class="panel maestro-detalle" role="tabpanel" hidden>
        <nav id="inv-lista" class="maestro tarjeta" aria-label="Inventory"></nav>
        <div id="inv-detalle" class="detalle tarjeta"><div class="cargando" data-t="loading"></div></div>
      </section>

      <section id="usage" class="panel columna" role="tabpanel" hidden>
        <div class="fila entre">
          <div>
            <h2 data-t="usage.title"></h2>
            <p class="tenue chico-texto" id="con-nota"></p>
          </div>
          <div class="segmentos" role="radiogroup" aria-label="Period">
            <label><input type="radio" name="con-dias" value="7" /><span data-t="usage.d7"></span></label>
            <label><input type="radio" name="con-dias" value="30" checked /><span data-t="usage.d30"></span></label>
            <label><input type="radio" name="con-dias" value="0" /><span data-t="usage.all"></span></label>
          </div>
        </div>
        <div id="con-contenido" class="consumo"><div class="cargando" data-t="usage.loading"></div></div>
      </section>

      <section id="sandbox" class="panel" role="tabpanel" hidden>
        <div class="sandbox">
          <div class="editor tarjeta">
            <label class="campo"><span data-t="sb.example"></span>
              <select id="sb-ejemplo"></select>
            </label>
            <p class="ayuda" data-t-html="sb.help"></p>
            <label class="campo"><span data-t="sb.titleField"></span>
              <input id="sb-titulo" type="text" />
            </label>
            <label class="campo crece"><span data-t="sb.code"></span>
              <textarea id="sb-codigo" spellcheck="false"></textarea>
            </label>
            <div class="fila fin">
              <span id="sb-estado" class="tenue" aria-live="polite"></span>
              <button id="sb-correr" class="boton" type="button" data-t="sb.run"></button>
            </div>
          </div>
          <div id="sb-resultado" class="resultado tarjeta"><p class="vacio" data-t-html="sb.empty"></p></div>
        </div>
      </section>

      <section id="history" class="panel columna" role="tabpanel" hidden>
        <div class="fila entre">
          <div>
            <h2 data-t="hist.title"></h2>
            <p class="tenue chico-texto" data-t-html="hist.where"></p>
          </div>
          <button id="hist-borrar" class="boton secundario peligro chico" type="button" data-t="hist.clear"></button>
        </div>
        <div id="hist-lista" class="tarjeta desplazable"></div>
      </section>

      <section id="learn" class="panel maestro-detalle" role="tabpanel" hidden>
        <nav id="exp-lista" class="maestro tarjeta" aria-label="Topics"></nav>
        <article id="exp-detalle" class="detalle tarjeta"></article>
      </section>
    </main>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
