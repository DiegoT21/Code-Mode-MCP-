# Builds the desktop installers on GitHub's machines when a version tag is pushed (git tag v1.0.0 && git push --tags)
# and attaches them to a draft release. The installers are not code-signed: Windows SmartScreen / Smart App
# Control and macOS Gatekeeper may warn or block them. `npx github:DiegoT21/Code-Mode-MCP-` needs no installer.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Linux libraries for the webview
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Panel dependencies (bundled inside the app)
        run: npm ci --omit=dev

      - name: Desktop build tools
        working-directory: escritorio
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: escritorio
          tagName: ${{ github.ref_name }}
          releaseName: Code Mode MCP ${{ github.ref_name }}
          releaseBody: 'Desktop app. Needs Node.js 20+. Or skip the installer: npx github:DiegoT21/Code-Mode-MCP-'
          releaseDraft: true
